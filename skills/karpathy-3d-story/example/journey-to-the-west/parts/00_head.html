<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>西游记 &mdash; Journey to the West</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #05070f;
  }
  /* The canvas must be positioned, not left in normal flow: a static in-flow
     canvas is not composited into a headless screenshot at all — the capture
     comes back as flat page background, which reads exactly like a scene that
     renders nothing. Explicit z-index then keeps the overlays above it, since
     the canvas is appended after them in DOM order. */
  canvas { display: block; position: fixed; left: 0; top: 0; z-index: 0; }

  /* ---- chapter title card, top-left ---- */
  #chapter {
    position: fixed; left: 34px; top: 30px; z-index: 2;
    color: #f4e2b8; pointer-events: none;
    font-family: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
    text-shadow: 0 2px 10px rgba(0,0,0,0.85);
    transition: opacity 0.9s ease;
  }
  #chapter .num {
    font-size: 13px; letter-spacing: 5px; opacity: 0.72; color: #d9a441;
  }
  #chapter .cn {
    font-size: 31px; letter-spacing: 7px; margin-top: 5px; font-weight: 600;
  }
  #chapter .en {
    font-size: 12px; letter-spacing: 2.4px; opacity: 0.6; margin-top: 6px;
    font-family: Georgia, "Times New Roman", serif; font-style: italic;
  }

  /* ---- caption track, bottom-centre ---- */
  #caption {
    position: fixed; left: 0; right: 0; bottom: 46px; z-index: 2;
    text-align: center; pointer-events: none;
    transition: opacity 0.6s ease;
  }
  #caption .cn {
    color: #f6ecd6; font-size: 21px; letter-spacing: 3.5px;
    font-family: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
    text-shadow: 0 2px 12px rgba(0,0,0,0.9);
  }
  #caption .en {
    color: #cbb98f; font-size: 12.5px; letter-spacing: 1.6px; margin-top: 8px;
    font-family: Georgia, "Times New Roman", serif; font-style: italic;
    opacity: 0.78; text-shadow: 0 1px 8px rgba(0,0,0,0.9);
  }

  /* ---- seal, bottom-right ---- */
  #seal {
    position: fixed; right: 30px; bottom: 26px; pointer-events: none; z-index: 2;
    width: 46px; height: 46px; border: 2px solid #b23a2e; border-radius: 3px;
    color: #d8483a; opacity: 0.72;
    font-family: "Songti SC", "STSong", serif; font-size: 17px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    letter-spacing: 0; line-height: 1.05; text-align: center;
    text-shadow: 0 1px 6px rgba(0,0,0,0.7);
  }

  /* ---- crossfade veil between chapters ---- */
  #fade {
    position: fixed; inset: 0; background: #05070f; z-index: 3;
    pointer-events: none; opacity: 0;
  }


  /* ---- transport bar ---- */
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; align-items: center; gap: 14px;
    padding: 13px 22px 15px;
    background: linear-gradient(to top, rgba(5,7,15,0.82), rgba(5,7,15,0));
    font-family: "Songti SC", Georgia, serif; color: #e6dcc4;
    opacity: 0; transition: opacity 0.45s ease;
  }
  #bar.show { opacity: 1; }
  #bar button {
    background: none; border: 1px solid rgba(230,220,196,0.35); border-radius: 3px;
    color: #e6dcc4; font-family: inherit; font-size: 13px; letter-spacing: 2px;
    padding: 5px 11px; cursor: pointer; min-width: 42px;
  }
  #bar button:hover { border-color: #d9a441; color: #f4e2b8; }
  #track {
    position: relative; flex: 1; height: 22px; cursor: pointer;
  }
  #track .rail {
    position: absolute; left: 0; right: 0; top: 9px; height: 4px;
    background: rgba(230,220,196,0.18); border-radius: 2px;
  }
  #track .fill {
    position: absolute; left: 0; top: 9px; height: 4px; width: 0;
    background: #d9a441; border-radius: 2px;
  }
  #track .tick {
    position: absolute; top: 5px; width: 1px; height: 12px;
    background: rgba(230,220,196,0.45);
  }
  #track .knob {
    position: absolute; top: 5px; width: 12px; height: 12px; margin-left: -6px;
    border-radius: 50%; background: #f4e2b8; box-shadow: 0 0 6px rgba(0,0,0,0.6);
  }
  #track .hover {
    position: absolute; bottom: 24px; transform: translateX(-50%);
    background: rgba(5,7,15,0.9); border: 1px solid rgba(230,220,196,0.25);
    padding: 3px 8px; font-size: 12px; letter-spacing: 1px; white-space: nowrap;
    border-radius: 3px; display: none; pointer-events: none;
  }
  #clock { font-size: 12.5px; letter-spacing: 1.5px; opacity: 0.85;
           font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
  #vol { width: 78px; accent-color: #d9a441; }

  /* ---- start gate: browsers refuse audio without a gesture ---- */
  #gate {
    position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 26px;
    background: radial-gradient(ellipse at center, #0d1224 0%, #05070f 75%);
    color: #f4e2b8; font-family: "Songti SC", "STSong", Georgia, serif;
    transition: opacity 0.8s ease;
  }
  #gate .big { font-size: 62px; letter-spacing: 22px; text-indent: 22px; font-weight: 600; }
  #gate .sub { font-size: 13px; letter-spacing: 4px; opacity: 0.6;
               font-family: Georgia, serif; font-style: italic; }
  #gate .row { display: flex; gap: 16px; align-items: center; margin-top: 8px; }
  #gate button {
    background: none; border: 1px solid rgba(244,226,184,0.5); border-radius: 3px;
    color: #f4e2b8; font-family: inherit; font-size: 15px; letter-spacing: 6px;
    text-indent: 6px; padding: 10px 26px; cursor: pointer;
  }
  #gate button:hover { border-color: #d9a441; background: rgba(217,164,65,0.12); }
  #gate .quiet { font-size: 12px; letter-spacing: 2px; opacity: 0.5;
                 cursor: pointer; text-decoration: underline; }
  #gate .quiet:hover { opacity: 0.85; }

  /* ---- loading notice (removed on first frame) ---- */
  #boot {
    position: fixed; inset: 0; z-index: 4; display: flex; align-items: center;
    justify-content: center; color: #6a6250; background: #05070f;
    font-family: "Songti SC", Georgia, serif; font-size: 15px; letter-spacing: 4px;
  }
</style>
</head>
<body>
<div id="boot">西行路上&hellip;</div>
<div id="chapter"><div class="num"></div><div class="cn"></div><div class="en"></div></div>
<div id="caption"><div class="cn"></div><div class="en"></div></div>
<div id="seal">西游</div>
<div id="fade"></div>
<div id="gate">
  <div class="big">西游记</div>
  <div class="sub">Journey to the West &mdash; a procedural telling in five chapters</div>
  <div class="row"><button id="gate-go">开 始</button></div>
  <div class="quiet" id="gate-mute">静音观看 · watch without sound</div>
</div>
<div id="bar">
  <button id="btn-play">暂停</button>
  <div id="track"><div class="rail"></div><div class="fill"></div><div class="knob"></div><div class="hover"></div></div>
  <div id="clock">0:00 / 0:00</div>
  <button id="btn-mute">静音</button>
  <input id="vol" type="range" min="0" max="100" value="80">
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
'use strict';
