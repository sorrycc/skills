<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>西游记 &mdash; Journey to the West</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #05070f;
  }
  /* The canvas must be positioned, not left in normal flow: a static in-flow
     canvas is not composited into a headless screenshot at all — the capture
     comes back as flat page background, which reads exactly like a scene that
     renders nothing. Explicit z-index then keeps the overlays above it, since
     the canvas is appended after them in DOM order. */
  canvas { display: block; position: fixed; left: 0; top: 0; z-index: 0; }

  /* ---- chapter title card, top-left ---- */
  #chapter {
    position: fixed; left: 34px; top: 30px; z-index: 2;
    color: #f4e2b8; pointer-events: none;
    font-family: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
    text-shadow: 0 2px 10px rgba(0,0,0,0.85);
    transition: opacity 0.9s ease;
  }
  #chapter .num {
    font-size: 13px; letter-spacing: 5px; opacity: 0.72; color: #d9a441;
  }
  #chapter .cn {
    font-size: 31px; letter-spacing: 7px; margin-top: 5px; font-weight: 600;
  }
  #chapter .en {
    font-size: 12px; letter-spacing: 2.4px; opacity: 0.6; margin-top: 6px;
    font-family: Georgia, "Times New Roman", serif; font-style: italic;
  }

  /* ---- caption track, bottom-centre ---- */
  #caption {
    position: fixed; left: 0; right: 0; bottom: 46px; z-index: 2;
    text-align: center; pointer-events: none;
    transition: opacity 0.6s ease;
  }
  #caption .cn {
    color: #f6ecd6; font-size: 21px; letter-spacing: 3.5px;
    font-family: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
    text-shadow: 0 2px 12px rgba(0,0,0,0.9);
  }
  #caption .en {
    color: #cbb98f; font-size: 12.5px; letter-spacing: 1.6px; margin-top: 8px;
    font-family: Georgia, "Times New Roman", serif; font-style: italic;
    opacity: 0.78; text-shadow: 0 1px 8px rgba(0,0,0,0.9);
  }

  /* ---- seal, bottom-right ---- */
  #seal {
    position: fixed; right: 30px; bottom: 26px; pointer-events: none; z-index: 2;
    width: 46px; height: 46px; border: 2px solid #b23a2e; border-radius: 3px;
    color: #d8483a; opacity: 0.72;
    font-family: "Songti SC", "STSong", serif; font-size: 17px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    letter-spacing: 0; line-height: 1.05; text-align: center;
    text-shadow: 0 1px 6px rgba(0,0,0,0.7);
  }

  /* ---- crossfade veil between chapters ---- */
  #fade {
    position: fixed; inset: 0; background: #05070f; z-index: 3;
    pointer-events: none; opacity: 0;
  }


  /* ---- transport bar ---- */
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; align-items: center; gap: 14px;
    padding: 13px 22px 15px;
    background: linear-gradient(to top, rgba(5,7,15,0.82), rgba(5,7,15,0));
    font-family: "Songti SC", Georgia, serif; color: #e6dcc4;
    opacity: 0; transition: opacity 0.45s ease;
  }
  #bar.show { opacity: 1; }
  #bar button {
    background: none; border: 1px solid rgba(230,220,196,0.35); border-radius: 3px;
    color: #e6dcc4; font-family: inherit; font-size: 13px; letter-spacing: 2px;
    padding: 5px 11px; cursor: pointer; min-width: 42px;
  }
  #bar button:hover { border-color: #d9a441; color: #f4e2b8; }
  #track {
    position: relative; flex: 1; height: 22px; cursor: pointer;
  }
  #track .rail {
    position: absolute; left: 0; right: 0; top: 9px; height: 4px;
    background: rgba(230,220,196,0.18); border-radius: 2px;
  }
  #track .fill {
    position: absolute; left: 0; top: 9px; height: 4px; width: 0;
    background: #d9a441; border-radius: 2px;
  }
  #track .tick {
    position: absolute; top: 5px; width: 1px; height: 12px;
    background: rgba(230,220,196,0.45);
  }
  #track .knob {
    position: absolute; top: 5px; width: 12px; height: 12px; margin-left: -6px;
    border-radius: 50%; background: #f4e2b8; box-shadow: 0 0 6px rgba(0,0,0,0.6);
  }
  #track .hover {
    position: absolute; bottom: 24px; transform: translateX(-50%);
    background: rgba(5,7,15,0.9); border: 1px solid rgba(230,220,196,0.25);
    padding: 3px 8px; font-size: 12px; letter-spacing: 1px; white-space: nowrap;
    border-radius: 3px; display: none; pointer-events: none;
  }
  #clock { font-size: 12.5px; letter-spacing: 1.5px; opacity: 0.85;
           font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
  #vol { width: 78px; accent-color: #d9a441; }

  /* ---- start gate: browsers refuse audio without a gesture ---- */
  #gate {
    position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 26px;
    background: radial-gradient(ellipse at center, #0d1224 0%, #05070f 75%);
    color: #f4e2b8; font-family: "Songti SC", "STSong", Georgia, serif;
    transition: opacity 0.8s ease;
  }
  #gate .big { font-size: 62px; letter-spacing: 22px; text-indent: 22px; font-weight: 600; }
  #gate .sub { font-size: 13px; letter-spacing: 4px; opacity: 0.6;
               font-family: Georgia, serif; font-style: italic; }
  #gate .row { display: flex; gap: 16px; align-items: center; margin-top: 8px; }
  #gate button {
    background: none; border: 1px solid rgba(244,226,184,0.5); border-radius: 3px;
    color: #f4e2b8; font-family: inherit; font-size: 15px; letter-spacing: 6px;
    text-indent: 6px; padding: 10px 26px; cursor: pointer;
  }
  #gate button:hover { border-color: #d9a441; background: rgba(217,164,65,0.12); }
  #gate .quiet { font-size: 12px; letter-spacing: 2px; opacity: 0.5;
                 cursor: pointer; text-decoration: underline; }
  #gate .quiet:hover { opacity: 0.85; }

  /* ---- loading notice (removed on first frame) ---- */
  #boot {
    position: fixed; inset: 0; z-index: 4; display: flex; align-items: center;
    justify-content: center; color: #6a6250; background: #05070f;
    font-family: "Songti SC", Georgia, serif; font-size: 15px; letter-spacing: 4px;
  }
</style>
</head>
<body>
<div id="boot">西行路上&hellip;</div>
<div id="chapter"><div class="num"></div><div class="cn"></div><div class="en"></div></div>
<div id="caption"><div class="cn"></div><div class="en"></div></div>
<div id="seal">西游</div>
<div id="fade"></div>
<div id="gate">
  <div class="big">西游记</div>
  <div class="sub">Journey to the West &mdash; a procedural telling in five chapters</div>
  <div class="row"><button id="gate-go">开 始</button></div>
  <div class="quiet" id="gate-mute">静音观看 · watch without sound</div>
</div>
<div id="bar">
  <button id="btn-play">暂停</button>
  <div id="track"><div class="rail"></div><div class="fill"></div><div class="knob"></div><div class="hover"></div></div>
  <div id="clock">0:00 / 0:00</div>
  <button id="btn-mute">静音</button>
  <input id="vol" type="range" min="0" max="100" value="80">
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
'use strict';


// ============================================================================
//  西游记 — a procedural three.js telling of Journey to the West
//  Five chapters, one file, everything built from code.
//
//  URL params (used by shot.sh, handy by hand):
//    ?chapter=N   jump straight to chapter N (1-5)
//    &t=SECONDS   local story time inside that chapter
//    &freeze=1    render exactly one frame and stop — deterministic screenshots
//    &seed=NNN    reseed the procedural placement
// ============================================================================

const PARAMS = new URLSearchParams(location.search);
const P_CHAPTER = PARAMS.has('chapter') ? Math.max(1, parseInt(PARAMS.get('chapter'), 10)) : null;
const P_TIME    = PARAMS.has('t') ? parseFloat(PARAMS.get('t')) : 0;
const P_FREEZE  = PARAMS.get('freeze') === '1';
const P_SEED    = PARAMS.has('seed') ? parseInt(PARAMS.get('seed'), 10) : 20260803;

// ============================================================================
//  Helpers — seeded RNG, so every load places the same rocks in the same spots.
//  Without this, two audit screenshots are of two different scenes and you
//  cannot tell a fix from a reroll.
// ============================================================================
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let _rng = mulberry32(P_SEED);
function rnd()          { return _rng(); }
function rand(a, b)     { return a + _rng() * (b - a); }
function randi(a, b)    { return Math.floor(rand(a, b + 1)); }
function pick(arr)      { return arr[Math.floor(_rng() * arr.length)]; }
function chance(p)      { return _rng() < p; }
function reseed(s)      { _rng = mulberry32(s); }

const clamp  = THREE.MathUtils.clamp;
const lerp   = THREE.MathUtils.lerp;
const smooth = THREE.MathUtils.smoothstep;
const TAU    = Math.PI * 2;

// Ease helpers for camera moves and beats
function ease(t)      { return t * t * (3 - 2 * t); }               // smoothstep
function easeOut(t)   { return 1 - Math.pow(1 - t, 3); }
function easeIn(t)    { return t * t * t; }
function pulse(t, a, b) { return clamp((t - a) / Math.max(1e-6, b - a), 0, 1); }

const STD = (o) => new THREE.MeshStandardMaterial(Object.assign({ roughness: 0.85, metalness: 0.0 }, o));
const PHONG = (o) => new THREE.MeshPhongMaterial(Object.assign({ shininess: 40 }, o));
const BASIC = (o) => new THREE.MeshBasicMaterial(Object.assign({}, o));

// A colour vocabulary borrowed from temple paint and opera costume.
const C = {
  cinnabar:  0xb8352a,   // 朱红  temple pillars, Wukong's skirt
  vermilion: 0xd94f2b,
  imperialY: 0xe8b83a,   // 明黄  the celestial palace
  gold:      0xf2c75c,
  darkGold:  0xa8781f,
  jade:      0x3f8f76,   // 青绿
  deepJade:  0x1f5a4c,
  ink:       0x1a1d26,
  stone:     0x6b6b6e,
  darkStone: 0x3b3b42,
  fur:       0x9a6b3e,   // Wukong
  furLight:  0xc09257,
  monkRobe:  0xc23b28,
  monkGold:  0xd9a441,
  pigSkin:   0xd9a0a0,
  shaRobe:   0x2f4157,
  cloud:     0xf3f1ea,
  flame:     0xff7a1a,
  ember:     0xffca5c,
  bone:      0xe7e2d4,
};

// ============================================================================
//  Renderer / scene / camera
// ============================================================================
// preserveDrawingBuffer only in freeze mode: it lets the screenshot tool grab a
// frame long after we stopped drawing, which is what makes a cheap 3-frame
// render enough. Leaving it on for playback would cost fps for nothing.
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance',
  preserveDrawingBuffer: P_FREEZE,
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x1a2438, 90, 620);

const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.5, 4000);
camera.position.set(0, 30, 120);

// ============================================================================
//  Sky — one dome for the whole film. The director drives its uniforms, so a
//  chapter change is a colour interpolation, not five separate skies.
// ============================================================================
const SKY = {
  top:    new THREE.Color(0x1b2a52),
  mid:    new THREE.Color(0x53628c),
  bot:    new THREE.Color(0xd98a4a),
  sun:    new THREE.Color(0xffc07a),
  sunDir: new THREE.Vector3(-0.5, 0.35, -0.8).normalize(),
  glow:   1.0,
  stars:  0.0,
};

const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  fog: false,
  uniforms: {
    topColor: { value: SKY.top },
    midColor: { value: SKY.mid },
    botColor: { value: SKY.bot },
    sunColor: { value: SKY.sun },
    sunDir:   { value: SKY.sunDir.clone() },
    uGlow:    { value: 1.0 },
    uStars:   { value: 0.0 },
    uTime:    { value: 0.0 },
  },
  vertexShader: `
    varying vec3 vDir;
    void main() {
      vDir = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform vec3 topColor, midColor, botColor, sunColor, sunDir;
    uniform float uGlow, uStars, uTime;
    varying vec3 vDir;

    float hash31(vec3 p) {
      p = fract(p * 0.3183099 + vec3(0.71, 0.113, 0.419));
      p *= 17.0;
      return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
    }

    void main() {
      vec3 d = normalize(vDir);
      float h = d.y;
      vec3 col = (h > 0.0) ? mix(midColor, topColor, pow(h, 0.7))
                           : mix(midColor, botColor, pow(-h, 0.55));

      // sun / celestial glow
      float s = max(dot(d, normalize(sunDir)), 0.0);
      col += sunColor * uGlow * (pow(s, 420.0) * 1.6 + pow(s, 22.0) * 0.40 + pow(s, 4.0) * 0.13);

      // sparse stars, faded in per chapter
      if (uStars > 0.001 && h > 0.02) {
        vec3 q = floor(d * 260.0);
        float n = hash31(q);
        float star = smoothstep(0.9975, 1.0, n);
        float tw = 0.65 + 0.35 * sin(uTime * 2.2 + n * 90.0);
        col += vec3(0.9, 0.94, 1.0) * star * tw * uStars * smoothstep(0.02, 0.35, h);
      }
      gl_FragColor = vec4(col, 1.0);
    }`,
});
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(1400, 48, 28), skyMat);
skyDome.frustumCulled = false;
scene.add(skyDome);

// ============================================================================
//  Light rig — one sun with shadows, one fill, one hemisphere. The director
//  retargets and recolours them per chapter rather than adding new lights.
// ============================================================================
const hemi = new THREE.HemisphereLight(0x8fa4d4, 0x3a3524, 0.55);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffd9a0, 1.5);
sun.position.set(-90, 110, -120);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -140;
sun.shadow.camera.right = 140;
sun.shadow.camera.top = 140;
sun.shadow.camera.bottom = -140;
sun.shadow.camera.near = 20;
sun.shadow.camera.far = 520;
sun.shadow.bias = -0.0007;
sun.shadow.normalBias = 0.6;
scene.add(sun);
scene.add(sun.target);

const fill = new THREE.DirectionalLight(0x6f86c4, 0.45);
fill.position.set(80, 45, 90);
scene.add(fill);

function setSun(dir, color, intensity) {
  sun.position.copy(dir);
  sun.color.set(color);
  sun.intensity = intensity;
  SKY.sunDir.copy(dir).normalize();
  skyMat.uniforms.sunDir.value.copy(SKY.sunDir);
}

// ============================================================================
//  Small shared builders used by every chapter
// ============================================================================
function shadowed(mesh, cast = true, receive = true) {
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  return mesh;
}

// A lumpy rock / mountain mass: a sphere pushed around by trig noise, flattened
// at the base so it always reads as sitting *on* the ground rather than in it.
function makeRockMass(radius, height, colorLow, colorHigh, seedOff = 0, segs = 28) {
  const geo = new THREE.SphereGeometry(radius, segs, Math.max(10, segs >> 1), 0, TAU, 0, Math.PI * 0.5);
  const pos = geo.attributes.position;
  const colors = [];
  const cl = new THREE.Color(colorLow), ch = new THREE.Color(colorHigh), tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const a = Math.atan2(z, x);
    const n = 1
      + Math.sin(a * 5.0 + seedOff) * 0.11
      + Math.sin(a * 11.0 + y * 0.16 + seedOff * 2.3) * 0.06
      + Math.cos(y * 0.33 + a * 3.0 + seedOff) * 0.05;
    const yn = y * (1 + Math.sin(a * 7.0 + seedOff * 1.7) * 0.06);
    pos.setXYZ(i, x * n, yn * (height / radius), z * n);
    tmp.copy(cl).lerp(ch, clamp(y / radius, 0, 1));
    colors.push(tmp.r, tmp.g, tmp.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  return shadowed(new THREE.Mesh(geo, STD({ vertexColors: true, roughness: 1.0, flatShading: true })));
}

// A jagged spire — the vertical rock vocabulary of 花果山 and 火焰山.
function makeSpire(r, h, color, seedOff = 0, tilt = 0) {
  const geo = new THREE.CylinderGeometry(r * 0.18, r, h, 7, 5, false);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const t = (y + h / 2) / h;
    const n = 1 + Math.sin(Math.atan2(z, x) * 4.0 + t * 6.0 + seedOff) * 0.16;
    pos.setXYZ(i, x * n, y + Math.sin(t * 5.0 + seedOff) * h * 0.02, z * n);
  }
  geo.computeVertexNormals();
  // Wrap it so the ORIGIN IS THE BASE. A bare cylinder mesh is centred on its
  // own middle, so every caller that places one at ground level buries half of
  // it — and anything anchored to "the top" ends up floating in mid-air.
  const m = shadowed(new THREE.Mesh(geo, STD({ color, roughness: 1.0, flatShading: true })));
  m.position.y = h / 2;
  const g = new THREE.Group();
  g.add(m);
  g.rotation.z = tilt;
  g.userData.height = h;
  return g;
}

// Round-topped foliage used for peach trees and pines.
function makeTreeSimple(scale, trunkColor, leafColor, blossom) {
  const g = new THREE.Group();
  const trunk = shadowed(new THREE.Mesh(
    new THREE.CylinderGeometry(0.22 * scale, 0.36 * scale, 3.0 * scale, 6),
    STD({ color: trunkColor, roughness: 1.0, flatShading: true })));
  trunk.position.y = 1.5 * scale;
  g.add(trunk);
  const canopy = [];
  const n = 3;
  for (let i = 0; i < n; i++) {
    const r = (1.5 - i * 0.28) * scale;
    const blob = shadowed(new THREE.Mesh(
      new THREE.SphereGeometry(r, 9, 7),
      STD({ color: leafColor, roughness: 1.0, flatShading: true })));
    blob.position.set(rand(-0.5, 0.5) * scale, (3.0 + i * 0.85) * scale, rand(-0.5, 0.5) * scale);
    blob.scale.y = 0.82;
    g.add(blob);
    canopy.push(blob);
  }
  if (blossom) {
    const dummy = new THREE.Object3D();
    const inst = new THREE.InstancedMesh(
      new THREE.SphereGeometry(0.13 * scale, 5, 4),
      STD({ color: 0xf2a8c0, roughness: 0.9, emissive: 0x3a1420, emissiveIntensity: 0.4 }),
      26);
    for (let i = 0; i < 26; i++) {
      const b = canopy[randi(0, canopy.length - 1)];
      const dir = new THREE.Vector3(rand(-1, 1), rand(-0.3, 1), rand(-1, 1)).normalize();
      const rr = b.geometry.parameters.radius * 0.95;
      dummy.position.copy(b.position).addScaledVector(dir, rr);
      dummy.scale.setScalar(rand(0.7, 1.5));
      dummy.updateMatrix();
      inst.setMatrixAt(i, dummy.matrix);
    }
    g.add(inst);
  }
  g.userData.canopy = canopy;
  return g;
}

// Chapter registry — each chapter file pushes {id, group, update} here.
const CHAPTER_IMPL = {};
function registerChapter(id, impl) { CHAPTER_IMPL[id] = impl; }

// Everything a chapter builds goes under its own group, parked at the origin.
// Only one is visible at a time, so chapters never leak into each other's
// framing and the camera splines can all be written in local coordinates.
function newChapterGroup(id) {
  const g = new THREE.Group();
  g.name = 'chapter_' + id;
  g.visible = false;
  scene.add(g);
  return g;
}


// ============================================================================
//  The actor kit
//
//  Everyone is built from the same rig so one walk cycle drives all of them:
//    actor.rig = { root, body, head, armL, armR, legL, legR }
//  Each limb is a group that pivots at its joint with a child group at the
//  elbow/knee, so a two-bone bend is two rotations and no skinning.
//  Origin of every actor is the SOLE OF THE FEET at y=0 — chapters place actors
//  by putting them on terrain height directly, which is what keeps them from
//  sinking or hovering.
// ============================================================================

function makeLimb(upperLen, lowerLen, r, mat) {
  const root = new THREE.Group();
  const up = shadowed(new THREE.Mesh(new THREE.CapsuleGeometry(r, Math.max(0.01, upperLen - 2 * r), 3, 7), mat));
  up.position.y = -upperLen / 2;
  root.add(up);
  const lower = new THREE.Group();
  lower.position.y = -upperLen;
  root.add(lower);
  const lo = shadowed(new THREE.Mesh(new THREE.CapsuleGeometry(r * 0.88, Math.max(0.01, lowerLen - 2 * r * 0.88), 3, 7), mat));
  lo.position.y = -lowerLen / 2;
  lower.add(lo);
  return { root, lower, end: lowerLen };
}

function makeHand(r, mat) {
  const h = shadowed(new THREE.Mesh(new THREE.SphereGeometry(r, 7, 6), mat));
  return h;
}

// Shared skeleton assembly. Everything below is a costume on top of this.
function makeBiped(cfg) {
  const H       = cfg.height;
  const skin    = cfg.skinMat;
  const cloth   = cfg.clothMat;
  const girth   = cfg.girth || 1.0;

  const root = new THREE.Group();
  const hipY = H * 0.46;
  const legU = hipY * 0.52, legL = hipY * 0.48;
  const shoulderY = H * 0.80;
  const armU = H * 0.19, armL = H * 0.17;

  const body = new THREE.Group();
  body.position.y = hipY;
  root.add(body);

  const torso = shadowed(new THREE.Mesh(
    new THREE.CapsuleGeometry(H * 0.115 * girth, H * 0.26, 4, 10), cloth));
  torso.position.y = H * 0.17;
  torso.scale.z = 0.82;
  body.add(torso);

  const head = new THREE.Group();
  head.position.y = H * 0.35;
  body.add(head);
  const skull = shadowed(new THREE.Mesh(new THREE.SphereGeometry(H * 0.105, 14, 12), skin));
  skull.scale.set(1, 1.06, 0.96);
  head.add(skull);

  // eyes — two dots is all it takes to make a silhouette read as a face
  const eyeMat = BASIC({ color: 0x14161c });
  for (const sx of [-1, 1]) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(H * 0.016, 7, 6), eyeMat);
    e.position.set(sx * H * 0.038, H * 0.012, H * 0.094);
    head.add(e);
  }

  const arms = {};
  for (const side of ['L', 'R']) {
    const s = side === 'L' ? -1 : 1;
    const limb = makeLimb(armU, armL, H * 0.032, cfg.armMat || cloth);
    limb.root.position.set(s * H * 0.125 * girth, shoulderY - hipY, 0);
    body.add(limb.root);
    const hand = makeHand(H * 0.036, skin);
    hand.position.y = -armL;
    limb.lower.add(hand);
    limb.hand = hand;
    arms[side] = limb;
  }

  const legs = {};
  for (const side of ['L', 'R']) {
    const s = side === 'L' ? -1 : 1;
    const limb = makeLimb(legU, legL, H * 0.042, cfg.legMat || cloth);
    limb.root.position.set(s * H * 0.055, 0, 0);
    body.add(limb.root);
    const foot = shadowed(new THREE.Mesh(
      new THREE.BoxGeometry(H * 0.075, H * 0.032, H * 0.14), cfg.footMat || STD({ color: C.ink })));
    foot.position.set(0, -legL - H * 0.012, H * 0.032);
    limb.lower.add(foot);
    limb.foot = foot;
    legs[side] = limb;
  }

  root.userData.rig = {
    root, body, head, skull,
    armL: arms.L, armR: arms.R,
    legL: legs.L, legR: legs.R,
    hipY, mode: cfg.mode || 'walk', phase: rand(0, TAU),
  };
  return root;
}

// One cycle for everybody. mode 'robe' hides the legs' contribution and sways
// the whole body instead — a monk in a floor-length kasaya has no visible gait.
function walk(actor, t, speed = 1, amp = 1) {
  const r = actor.userData.rig;
  if (!r) return;
  const p = t * speed * 4.2 + r.phase;
  const s = Math.sin(p), c = Math.cos(p);

  if (r.mode !== 'robe') {
    r.legL.root.rotation.x = s * 0.62 * amp;
    r.legR.root.rotation.x = -s * 0.62 * amp;
    r.legL.lower.rotation.x = Math.max(0, -Math.sin(p - 0.7)) * 0.85 * amp;
    r.legR.lower.rotation.x = Math.max(0, -Math.sin(p + Math.PI - 0.7)) * 0.85 * amp;
  }
  if (!r.lockArmL) {
    r.armL.root.rotation.x = -s * 0.52 * amp;
    r.armL.lower.rotation.x = -Math.max(0, Math.sin(p)) * 0.4 * amp;
  }
  if (!r.lockArmR) {
    r.armR.root.rotation.x = s * 0.52 * amp;
    r.armR.lower.rotation.x = -Math.max(0, -Math.sin(p)) * 0.4 * amp;
  }
  r.body.position.y = r.hipY + Math.abs(c) * 0.045 * amp * (r.mode === 'robe' ? 0.5 : 1);
  r.body.rotation.z = s * 0.035 * amp;
  r.head.rotation.y = Math.sin(p * 0.31) * 0.18;
}

// Standing idle: breathing, a little weight shift.
function idle(actor, t, amp = 1) {
  const r = actor.userData.rig;
  if (!r) return;
  const p = t * 1.5 + r.phase;
  r.body.position.y = r.hipY + Math.sin(p) * 0.02 * amp;
  r.body.rotation.z = Math.sin(p * 0.6) * 0.02 * amp;
  r.head.rotation.y = Math.sin(p * 0.42) * 0.2 * amp;
  if (!r.lockArmL) r.armL.root.rotation.x = Math.sin(p * 0.8) * 0.06;
  if (!r.lockArmR) r.armR.root.rotation.x = Math.sin(p * 0.8 + 1) * 0.06;
}

function faceTo(actor, x, z) {
  actor.rotation.y = Math.atan2(x - actor.position.x, z - actor.position.z);
}

// ---------------------------------------------------------------------------
//  孙悟空 — Sun Wukong
// ---------------------------------------------------------------------------
function makeWukong(height = 3.4) {
  const furMat  = STD({ color: C.fur, roughness: 1.0 });
  const faceMat = STD({ color: C.furLight, roughness: 1.0 });
  const tunic   = STD({ color: C.imperialY, roughness: 0.8 });
  const a = makeBiped({
    height, skinMat: faceMat, clothMat: tunic,
    armMat: furMat, legMat: furMat,
    footMat: STD({ color: 0x7a2c22 }),
  });
  const r = a.userData.rig;
  const H = height;

  // muzzle + brow: the monkey read comes almost entirely from these two
  const muzzle = new THREE.Mesh(new THREE.SphereGeometry(H * 0.058, 10, 8), faceMat);
  muzzle.position.set(0, -H * 0.022, H * 0.082);
  muzzle.scale.set(1.15, 0.8, 1.0);
  r.head.add(muzzle);
  const brow = new THREE.Mesh(new THREE.BoxGeometry(H * 0.13, H * 0.02, H * 0.03), STD({ color: 0x6a4526 }));
  brow.position.set(0, H * 0.042, H * 0.088);
  r.head.add(brow);
  // fur ruff around the face
  const ruff = new THREE.Mesh(new THREE.TorusGeometry(H * 0.098, H * 0.022, 6, 16), furMat);
  ruff.position.set(0, 0, H * 0.012);
  ruff.rotation.x = 0.1;
  r.head.add(ruff);
  for (const sx of [-1, 1]) {
    const ear = new THREE.Mesh(new THREE.SphereGeometry(H * 0.032, 8, 6), faceMat);
    ear.position.set(sx * H * 0.108, H * 0.01, 0);
    ear.scale.set(0.5, 1, 1);
    r.head.add(ear);
  }
  // 金箍 — the gold band. Wukong is unmistakable with it and generic without.
  const band = new THREE.Mesh(
    new THREE.TorusGeometry(H * 0.104, H * 0.013, 8, 22),
    STD({ color: C.gold, metalness: 0.85, roughness: 0.25, emissive: 0x3a2a04, emissiveIntensity: 0.5 }));
  band.position.y = H * 0.055;
  band.rotation.x = Math.PI / 2;
  r.head.add(band);

  // 虎皮裙 — tiger-skin skirt
  const skirt = shadowed(new THREE.Mesh(
    new THREE.CylinderGeometry(H * 0.125, H * 0.165, H * 0.17, 12, 1, true),
    STD({ color: 0xd98c2b, roughness: 1.0, side: THREE.DoubleSide })));
  skirt.position.y = H * 0.02;
  r.body.add(skirt);
  for (let i = 0; i < 6; i++) {
    const stripe = new THREE.Mesh(
      new THREE.BoxGeometry(H * 0.018, H * 0.10, H * 0.012),
      STD({ color: 0x3a2410 }));
    const ang = (i / 6) * TAU + 0.3;
    stripe.position.set(Math.cos(ang) * H * 0.15, H * 0.02, Math.sin(ang) * H * 0.15);
    stripe.rotation.y = -ang;
    r.body.add(stripe);
  }
  // red scarf
  const scarf = new THREE.Mesh(new THREE.TorusGeometry(H * 0.088, H * 0.016, 6, 16), STD({ color: C.cinnabar }));
  scarf.position.y = H * 0.30;
  scarf.rotation.x = Math.PI / 2;
  r.body.add(scarf);

  // tail — a curved tube that the update hook can wag
  const tailCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 0, -H * 0.05),
    new THREE.Vector3(0, H * 0.10, -H * 0.22),
    new THREE.Vector3(0, H * 0.24, -H * 0.34),
    new THREE.Vector3(0, H * 0.36, -H * 0.24),
  ]);
  const tail = new THREE.Mesh(new THREE.TubeGeometry(tailCurve, 18, H * 0.02, 6, false), furMat);
  tail.position.y = H * 0.02;
  r.body.add(tail);
  r.tail = tail;

  // 金箍棒 — held in the right hand, scalable along its own axis
  const staffGroup = new THREE.Group();
  const shaft = shadowed(new THREE.Mesh(
    new THREE.CylinderGeometry(H * 0.019, H * 0.019, H * 1.5, 10),
    STD({ color: 0x8a5a20, metalness: 0.5, roughness: 0.45 })));
  staffGroup.add(shaft);
  for (const sy of [-1, 1]) {
    const cap = new THREE.Mesh(
      new THREE.CylinderGeometry(H * 0.026, H * 0.026, H * 0.10, 10),
      STD({ color: C.gold, metalness: 0.9, roughness: 0.2, emissive: 0x2e2205, emissiveIntensity: 0.6 }));
    cap.position.y = sy * H * 0.72;
    staffGroup.add(cap);
  }
  staffGroup.rotation.z = Math.PI / 2;   // held across the body by default
  staffGroup.position.y = -r.armR.end;
  r.armR.lower.add(staffGroup);
  r.staff = staffGroup;
  r.staffBaseLen = H * 1.5;

  a.userData.kind = 'wukong';
  return a;
}

// ---------------------------------------------------------------------------
//  唐僧 — Tang Sanzang, the monk. Robe mode: no visible gait.
// ---------------------------------------------------------------------------
function makeTang(height = 3.7) {
  const skin = STD({ color: 0xe8cba8, roughness: 0.9 });
  const robe = STD({ color: C.monkRobe, roughness: 0.85 });
  const a = makeBiped({ height, skinMat: skin, clothMat: robe, armMat: robe, mode: 'robe' });
  const r = a.userData.rig;
  const H = height;

  // floor-length kasaya hides the legs entirely
  r.legL.root.visible = false;
  r.legR.root.visible = false;
  const kasaya = shadowed(new THREE.Mesh(
    new THREE.CylinderGeometry(H * 0.13, H * 0.24, H * 0.50, 16, 1, true),
    STD({ color: C.monkRobe, roughness: 0.85, side: THREE.DoubleSide })));
  kasaya.position.y = -H * 0.20;
  r.body.add(kasaya);
  // gold panel trim
  for (let i = 0; i < 4; i++) {
    const band = new THREE.Mesh(
      new THREE.TorusGeometry(H * (0.145 + i * 0.028), H * 0.011, 6, 22),
      STD({ color: C.monkGold, metalness: 0.6, roughness: 0.35 }));
    band.position.y = -H * (0.04 + i * 0.11);
    band.rotation.x = Math.PI / 2;
    r.body.add(band);
  }
  const sash = new THREE.Mesh(new THREE.BoxGeometry(H * 0.075, H * 0.42, H * 0.02), STD({ color: C.monkGold }));
  sash.position.set(0, H * 0.10, H * 0.10);
  sash.rotation.z = 0.22;
  r.body.add(sash);

  // 毗卢帽 — the five-panel crown
  const hat = new THREE.Group();
  const crown = shadowed(new THREE.Mesh(
    new THREE.CylinderGeometry(H * 0.108, H * 0.115, H * 0.075, 14),
    STD({ color: C.monkGold, metalness: 0.55, roughness: 0.4 })));
  hat.add(crown);
  for (let i = 0; i < 5; i++) {
    const ang = -Math.PI * 0.55 + (i / 4) * Math.PI * 1.1;
    const petal = new THREE.Mesh(
      new THREE.ConeGeometry(H * 0.028, H * 0.075, 4),
      STD({ color: C.cinnabar, metalness: 0.3, roughness: 0.5 }));
    petal.position.set(Math.sin(ang) * H * 0.085, H * 0.072, Math.cos(ang) * H * 0.085);
    petal.rotation.set(Math.cos(ang) * 0.22, ang, -Math.sin(ang) * 0.22);
    hat.add(petal);
  }
  hat.position.y = H * 0.105;
  r.head.add(hat);
  r.hat = hat;

  // 锡杖 — ringed staff, in the left hand, held upright
  const staff = new THREE.Group();
  const pole = shadowed(new THREE.Mesh(
    new THREE.CylinderGeometry(H * 0.014, H * 0.016, H * 0.95, 8),
    STD({ color: 0x6b4a24, roughness: 0.9 })));
  staff.add(pole);
  const finial = new THREE.Mesh(
    new THREE.TorusGeometry(H * 0.05, H * 0.010, 6, 18),
    STD({ color: C.monkGold, metalness: 0.8, roughness: 0.25, emissive: 0x2a1e04, emissiveIntensity: 0.5 }));
  finial.position.y = H * 0.52;
  staff.add(finial);
  for (let i = 0; i < 4; i++) {
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(H * 0.020, H * 0.005, 5, 12),
      STD({ color: C.monkGold, metalness: 0.8, roughness: 0.3 }));
    ring.position.set((i - 1.5) * H * 0.026, H * 0.545, 0);
    staff.add(ring);
  }
  staff.position.set(0, -r.armL.end - H * 0.32, 0);
  r.armL.lower.add(staff);
  r.staff = staff;
  r.lockArmL = true;
  r.armL.root.rotation.x = -0.25;

  a.userData.kind = 'tang';
  return a;
}

// ---------------------------------------------------------------------------
//  猪八戒 — Zhu Bajie. Wide, low, and unmistakably a pig from behind.
// ---------------------------------------------------------------------------
function makeBajie(height = 3.2) {
  const skin = STD({ color: C.pigSkin, roughness: 0.95 });

  const belly = shadowed(new THREE.Mesh(new THREE.SphereGeometry(H * 0.20, 14, 12), robe));

  const snout = new THREE.Mesh(new THREE.CylinderGeometry(H * 0.045, H * 0.052, H * 0.06, 10), skin);
  snout.rotation.x = Math.PI / 2;
  snout.position.set(0, -H * 0.018, H * 0.108);
  r.head.add(snout);
  const nostrilMat = BASIC({ color: 0x6a3f42 });
  for (const sx of [-1, 1]) {

    n.position.set(sx * H * 0.017, -H * 0.018, H * 0.139);

  }
  for (const sx of [-1, 1]) {
    const ear = shadowed(new THREE.Mesh(new THREE.ConeGeometry(H * 0.055, H * 0.13, 5), skin));
    ear.position.set(sx * H * 0.10, H * 0.045, -H * 0.01);
    ear.rotation.set(0.5, 0, sx * 1.15);
    ear.scale.z = 0.35;
    r.head.add(ear);
  }
  for (const sx of [-1, 1]) {
    const tusk = new THREE.Mesh(new THREE.ConeGeometry(H * 0.012, H * 0.05, 5), STD({ color: C.bone }));
    tusk.position.set(sx * H * 0.032, -H * 0.005, H * 0.115);
    tusk.rotation.x = -0.35;
    r.head.add(tusk);

  // 九齿钉耙 — nine-tooth rake, over the shoulder

// ---------------------------------------------------------------------------

function makeWujing(height = 3.6) {
  const skin = STD({ color: 0x8fa08f, roughness: 0.95 });

  const hair = new THREE.Mesh(new THREE.SphereGeometry(H * 0.115, 12, 10), STD({ color: 0x8e3b22, roughness: 1.0 }));

  beard.position.set(0, -H * 0.10, H * 0.055);
  beard.rotation.x = 0.22;
  r.head.add(beard);

  // 九颗骷髅项链

  // luggage pole on the back — Wujing carries the baggage the whole way

// ---------------------------------------------------------------------------
//  白龙马 — the white horse. Four limbs on the same rig, phase-offset.
// ---------------------------------------------------------------------------
function makeHorse(scale = 1) {
  const white = STD({ color: 0xece7dd, roughness: 0.95 });
  const mane  = STD({ color: 0xd6cbb6, roughness: 1.0 });
  const g = new THREE.Group();
  const H = 3.0 * scale;

  const body = new THREE.Group();
  body.position.y = H * 0.62;
  g.add(body);

  // The barrel runs nose-to-tail, i.e. along Z. Rotating it about Z instead
  // would lay the horse's body across its own direction of travel.
  const barrel = shadowed(new THREE.Mesh(new THREE.CapsuleGeometry(H * 0.20, H * 0.52, 5, 12), white));
  barrel.rotation.x = Math.PI / 2;
  barrel.scale.set(0.88, 1, 1);
  body.add(barrel);

  const neck = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(H * 0.11, H * 0.155, H * 0.42, 9), white));
  neck.position.set(0, H * 0.20, H * 0.30);
  neck.rotation.x = 0.62;
  body.add(neck);

  const headG = new THREE.Group();
  headG.position.set(0, H * 0.38, H * 0.48);
  body.add(headG);
  const skull = shadowed(new THREE.Mesh(new THREE.BoxGeometry(H * 0.14, H * 0.15, H * 0.30), white));
  skull.rotation.x = 0.42;
  headG.add(skull);
  const muzzle = shadowed(new THREE.Mesh(new THREE.BoxGeometry(H * 0.10, H * 0.09, H * 0.12), white));
  muzzle.position.set(0, -H * 0.085, H * 0.15);
  headG.add(muzzle);
  for (const sx of [-1, 1]) {
    const ear = new THREE.Mesh(new THREE.ConeGeometry(H * 0.03, H * 0.08, 5), white);
    ear.position.set(sx * H * 0.055, H * 0.10, -H * 0.06);
    headG.add(ear);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(H * 0.018, 6, 5), BASIC({ color: 0x1b1b20 }));
    eye.position.set(sx * H * 0.072, H * 0.02, H * 0.03);
    headG.add(eye);
  }
  const forelock = new THREE.Mesh(new THREE.BoxGeometry(H * 0.07, H * 0.10, H * 0.03), mane);
  forelock.position.set(0, H * 0.08, -H * 0.10);
  headG.add(forelock);

  // crest mane along the neck
  for (let i = 0; i < 7; i++) {
    const t = i / 6;
    const tuft = new THREE.Mesh(new THREE.BoxGeometry(H * 0.035, H * 0.09, H * 0.05), mane);
    tuft.position.set(0, H * (0.10 + t * 0.30), H * (0.16 + t * 0.30));
    tuft.rotation.x = 0.62;
    body.add(tuft);
  }
  const tail = new THREE.Mesh(new THREE.ConeGeometry(H * 0.075, H * 0.42, 7), mane);
  tail.position.set(0, H * 0.02, -H * 0.40);
  tail.rotation.x = -0.55;
  body.add(tail);

  // red saddle and blanket — this is a pilgrim's horse, not a wild one
  const saddle = shadowed(new THREE.Mesh(new THREE.BoxGeometry(H * 0.30, H * 0.07, H * 0.30), STD({ color: C.cinnabar })));
  saddle.position.y = H * 0.20;
  body.add(saddle);
  const blanket = shadowed(new THREE.Mesh(new THREE.BoxGeometry(H * 0.42, H * 0.02, H * 0.38), STD({ color: C.imperialY })));
  blanket.position.y = H * 0.165;
  body.add(blanket);

  const legs = [];
  const legDefs = [[-1, 1], [1, 1], [-1, -1], [1, -1]];
  for (let i = 0; i < 4; i++) {
    const [sx, sz] = legDefs[i];
    const limb = makeLimb(H * 0.30, H * 0.32, H * 0.045, white);
    limb.root.position.set(sx * H * 0.135, -H * 0.02, sz * H * 0.24);
    body.add(limb.root);
    const hoof = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(H * 0.05, H * 0.055, H * 0.05, 7), STD({ color: 0x4b4038 })));
    hoof.position.y = -H * 0.32;
    limb.lower.add(hoof);
    legs.push(limb);
  }

  g.userData.horse = { body, headG, legs, baseY: H * 0.62, H };
  return g;
}

function horseWalk(horse, t, speed = 1, amp = 1) {
  const h = horse.userData.horse;
  const p = t * speed * 3.6;
  const offs = [0, Math.PI, Math.PI, 0];   // diagonal pairs
  for (let i = 0; i < 4; i++) {
    const ph = p + offs[i];
    h.legs[i].root.rotation.x = Math.sin(ph) * 0.48 * amp;
    h.legs[i].lower.rotation.x = Math.max(0, -Math.sin(ph - 0.6)) * 0.55 * amp;
  }
  h.body.position.y = h.baseY + Math.abs(Math.cos(p)) * 0.05 * amp;
  h.headG.rotation.x = Math.sin(p) * 0.06 * amp;
}

// ---------------------------------------------------------------------------
//  天兵 — a celestial soldier. Deliberately uniform: they are a crowd, not
//  characters, and the crowd is what makes 大闹天宫 read as a battle.
// ---------------------------------------------------------------------------
function makeSoldier(height = 3.5, plumeColor = 0xd94f2b) {
  const armour = STD({ color: 0x9fa8b8, metalness: 0.75, roughness: 0.42 });
  const skin   = STD({ color: 0xd9b58e, roughness: 0.9 });
  const a = makeBiped({ height, skinMat: skin, clothMat: armour, footMat: STD({ color: 0x3a3a42 }) });
  const r = a.userData.rig;
  const H = height;

  // shoulder pauldrons + helmet + plume
  for (const sx of [-1, 1]) {
    const pauld = shadowed(new THREE.Mesh(
      new THREE.SphereGeometry(H * 0.062, 8, 6, 0, TAU, 0, Math.PI * 0.55),
      STD({ color: C.darkGold, metalness: 0.8, roughness: 0.35 })));
    pauld.position.set(sx * H * 0.128, H * 0.335, 0);
    r.body.add(pauld);
  }
  const helm = shadowed(new THREE.Mesh(
    new THREE.ConeGeometry(H * 0.115, H * 0.14, 10),
    STD({ color: C.darkGold, metalness: 0.85, roughness: 0.3 })));
  helm.position.y = H * 0.075;
  r.head.add(helm);
  const plume = new THREE.Mesh(new THREE.ConeGeometry(H * 0.022, H * 0.11, 6), STD({ color: plumeColor }));
  plume.position.y = H * 0.20;
  r.head.add(plume);
  const cuirass = shadowed(new THREE.Mesh(
    new THREE.CylinderGeometry(H * 0.128, H * 0.135, H * 0.20, 12),
    STD({ color: C.cinnabar, roughness: 0.6 })));
  cuirass.position.y = H * 0.20;
  cuirass.scale.z = 0.82;
  r.body.add(cuirass);

  // spear, gripped upright in the right hand
  const spear = new THREE.Group();
  const shaft = shadowed(new THREE.Mesh(
    new THREE.CylinderGeometry(H * 0.013, H * 0.013, H * 1.25, 7), STD({ color: 0x5d4326 })));
  spear.add(shaft);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(H * 0.030, H * 0.15, 6),
    STD({ color: 0xd6dde6, metalness: 0.9, roughness: 0.2 }));
  tip.position.y = H * 0.70;
  spear.add(tip);
  const tassel = new THREE.Mesh(new THREE.ConeGeometry(H * 0.026, H * 0.07, 6), STD({ color: C.cinnabar }));
  tassel.position.y = H * 0.60;
  tassel.rotation.x = Math.PI;
  spear.add(tassel);
  spear.position.set(0, -r.armR.end - H * 0.36, 0);
  r.armR.lower.add(spear);
  r.spear = spear;
  r.lockArmR = true;
  r.armR.root.rotation.x = -0.15;

  a.userData.kind = 'soldier';
  return a;
}

// ---------------------------------------------------------------------------
//  A small monkey of 花果山 — Wukong's subjects, built cheap and used in bulk.
// ---------------------------------------------------------------------------
function makeMonkeySmall(scale = 1) {
  const fur = STD({ color: pick([0xa8794a, 0xb98a55, 0x94663a]), roughness: 1.0 });
  const face = STD({ color: C.furLight, roughness: 1.0 });
  const g = new THREE.Group();
  const s = 0.9 * scale;
  const body = shadowed(new THREE.Mesh(new THREE.CapsuleGeometry(0.20 * s, 0.28 * s, 3, 8), fur));
  body.position.y = 0.44 * s;
  g.add(body);
  const head = shadowed(new THREE.Mesh(new THREE.SphereGeometry(0.19 * s, 9, 8), fur));
  head.position.y = 0.80 * s;
  g.add(head);
  const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.11 * s, 8, 6), face);
  muzzle.position.set(0, 0.77 * s, 0.14 * s);
  muzzle.scale.set(1.1, 0.85, 1);
  g.add(muzzle);
  for (const sx of [-1, 1]) {
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.06 * s, 6, 5), face);
    ear.position.set(sx * 0.185 * s, 0.82 * s, 0);
    ear.scale.x = 0.5;
    g.add(ear);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.028 * s, 6, 5), BASIC({ color: 0x14161c }));
    eye.position.set(sx * 0.065 * s, 0.855 * s, 0.165 * s);
    g.add(eye);
    const arm = shadowed(new THREE.Mesh(new THREE.CapsuleGeometry(0.055 * s, 0.28 * s, 3, 6), fur));
    arm.position.set(sx * 0.24 * s, 0.44 * s, 0);
    arm.rotation.z = sx * 0.35;
    g.add(arm);
    const leg = shadowed(new THREE.Mesh(new THREE.CapsuleGeometry(0.065 * s, 0.24 * s, 3, 6), fur));
    leg.position.set(sx * 0.11 * s, 0.17 * s, 0);
    g.add(leg);
  }
  const tailCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 0.34 * s, -0.16 * s),
    new THREE.Vector3(0, 0.52 * s, -0.42 * s),
    new THREE.Vector3(0, 0.86 * s, -0.44 * s),
  ]);
  g.add(new THREE.Mesh(new THREE.TubeGeometry(tailCurve, 12, 0.035 * s, 5, false), fur));
  g.userData.monkey = { body, head, base: 0.44 * s, phase: rand(0, TAU) };
  return g;
}

function monkeyIdle(m, t) {
  const d = m.userData.monkey;
  const p = t * 2.4 + d.phase;
  d.body.position.y = d.base + Math.abs(Math.sin(p)) * 0.06;
  d.head.rotation.y = Math.sin(p * 0.7) * 0.5;
  m.rotation.y = m.userData.baseRotY !== undefined
    ? m.userData.baseRotY + Math.sin(p * 0.31) * 0.25
    : m.rotation.y;
}


// ============================================================================
//  Shared effects and architecture
//
//  Every factory here returns an object with a .group (or .mesh) and an
//  .update(t, dt). Chapters own the placement; this file owns the behaviour.
// ============================================================================

// ---------------------------------------------------------------------------
//  Water — a lit standard material with wave displacement patched into the
//  vertex stage, so it still takes the chapter's sun, shadows and fog.
// ---------------------------------------------------------------------------
function makeWater(size, segs, color, amp = 0.55, opts = {}) {
  const geo = new THREE.PlaneGeometry(size, size, segs, segs);
  geo.rotateX(-Math.PI / 2);
  const mat = STD({
    color,
    roughness: opts.roughness !== undefined ? opts.roughness : 0.22,
    metalness: opts.metalness !== undefined ? opts.metalness : 0.35,
    transparent: !!opts.transparent,
    opacity: opts.opacity !== undefined ? opts.opacity : 1.0,
  });
  const uTime = { value: 0 };
  const uAmp = { value: amp };
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = uTime;
    sh.uniforms.uAmp = uAmp;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `
        #include <common>
        uniform float uTime; uniform float uAmp;
        float waveH(vec2 p) {
          return uAmp * (sin(p.x * 0.085 + uTime * 0.85) * cos(p.y * 0.072 - uTime * 0.62)
                       + 0.5 * sin(p.x * 0.21 - p.y * 0.17 + uTime * 1.5));
        }`)
      .replace('#include <beginnormal_vertex>', `
        #include <beginnormal_vertex>
        {
          vec2 p = position.xz;
          float e = 1.2;
          float hx = waveH(p + vec2(e, 0.0)) - waveH(p - vec2(e, 0.0));
          float hz = waveH(p + vec2(0.0, e)) - waveH(p - vec2(0.0, e));
          objectNormal = normalize(vec3(-hx / (2.0 * e), 1.0, -hz / (2.0 * e)));
        }`)
      .replace('#include <begin_vertex>', `
        #include <begin_vertex>
        transformed.y += waveH(position.xz);`);
  };
  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  return { mesh, update: (t) => { uTime.value = t; } };
}

// ---------------------------------------------------------------------------
//  Waterfall — scrolling translucent sheets. Three layers at slightly
//  different speeds is what stops it looking like a moving wallpaper.
// ---------------------------------------------------------------------------
function makeWaterfall(width, height, opts = {}) {
  const group = new THREE.Group();
  const uTime = { value: 0 };
  const layers = 3;
  for (let i = 0; i < layers; i++) {
    const mat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      blending: opts.blending || THREE.NormalBlending,
      uniforms: {
        uTime: uTime,
        uSpeed: { value: (1.5 + i * 0.55) * (opts.speed !== undefined ? opts.speed / 1.5 : 1) },
        uColor: { value: new THREE.Color(opts.color || 0xcfe4f2) },
        uOpacity: { value: (opts.opacity || 0.55) * (1 - i * 0.18) },
        uScale: { value: (opts.scale || 5.0) + i * 3.0 },
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        uniform float uTime, uSpeed, uOpacity, uScale;
        uniform vec3 uColor;
        varying vec2 vUv;
        float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float noise(vec2 p){
          vec2 i = floor(p), f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash(i), hash(i + vec2(1,0)), f.x),
                     mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), f.x), f.y);
        }
        void main() {
          vec2 uv = vUv;
          float streak = noise(vec2(uv.x * uScale, uv.y * 2.2 - uTime * uSpeed));
          streak += 0.5 * noise(vec2(uv.x * uScale * 2.3, uv.y * 4.0 - uTime * uSpeed * 1.6));
          streak = smoothstep(0.45, 1.05, streak);
          // fade at the vertical edges, froth at the foot
          float edge = smoothstep(0.0, 0.12, uv.x) * smoothstep(1.0, 0.88, uv.x);
          float foot = smoothstep(0.0, 0.22, uv.y);
          float top  = smoothstep(1.0, 0.72, uv.y);
          float a = uOpacity * edge * (0.35 + 0.65 * streak) * mix(0.25, 1.0, foot) * mix(0.0, 1.0, top);
          vec3 col = mix(uColor * 0.72, vec3(1.0), streak * 0.8);
          gl_FragColor = vec4(col, clamp(a, 0.0, 1.0));
        }`,
    });
    const m = new THREE.Mesh(new THREE.PlaneGeometry(width * (1 - i * 0.05), height, 1, 1), mat);
    m.position.z = i * 0.35;
    m.renderOrder = 5 + i;
    group.add(m);
  }
  return { group, update: (t) => { uTime.value = t; } };
}

// ---------------------------------------------------------------------------
//  Point fields — embers, petals, snow, sparks, motes. One shader, four moods.
//  Points are always camera-facing, which is exactly what these need, and they
//  cost almost nothing next to instanced billboards.
// ---------------------------------------------------------------------------
function makePointField(count, opts) {
  const style   = opts.style || 'glow';
  const area    = opts.area || new THREE.Vector3(60, 30, 60);
  const origin  = opts.origin || new THREE.Vector3(0, 0, 0);
  const rise    = opts.rise !== undefined ? opts.rise : 4.0;
  const drift   = opts.drift !== undefined ? opts.drift : 1.2;
  const sizeMin = opts.sizeMin || 1.0;
  const sizeMax = opts.sizeMax || 3.0;
  const colA    = new THREE.Color(opts.colorA || 0xffb457);
  const colB    = new THREE.Color(opts.colorB || 0xff5a1e);
  const spin    = opts.spin !== undefined ? opts.spin : 0.0;

  const pos = new Float32Array(count * 3);
  const seed = new Float32Array(count);
  const size = new Float32Array(count);
  const mixv = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    pos[i * 3 + 0] = origin.x + rand(-area.x, area.x);
    pos[i * 3 + 1] = origin.y + rand(0, area.y);
    pos[i * 3 + 2] = origin.z + rand(-area.z, area.z);
    seed[i] = rnd();
    size[i] = rand(sizeMin, sizeMax);
    mixv[i] = rnd();
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  geo.setAttribute('aMix', new THREE.BufferAttribute(mixv, 1));
  geo.computeBoundingSphere();
  geo.boundingSphere.radius = Math.max(area.x, area.y, area.z) * 3;

  const uTime = { value: 0 };
  const uFade = { value: 1 };
  const mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: (style === 'ember' || style === 'spark' || style === 'glow')
      ? THREE.AdditiveBlending : THREE.NormalBlending,
    uniforms: {
      uTime: uTime, uFade: uFade,
      uPix: { value: Math.min(window.devicePixelRatio, 2) },
      uColA: { value: colA }, uColB: { value: colB },
      uRise: { value: rise }, uDrift: { value: drift },
      uSpanY: { value: area.y }, uOriginY: { value: origin.y },
      uSpin: { value: spin },
    },
    vertexShader: `
      attribute float aSeed, aSize, aMix;
      uniform float uTime, uPix, uRise, uDrift, uSpanY, uOriginY, uSpin;
      varying float vSeed, vMix, vAlpha;
      void main() {
        vSeed = aSeed; vMix = aMix;
        vec3 p = position;
        float life = fract(aSeed + uTime * uRise / max(uSpanY, 0.001));
        p.y = uOriginY + life * uSpanY;
        p.x += sin(uTime * (0.4 + aSeed) + aSeed * 30.0) * uDrift;
        p.z += cos(uTime * (0.33 + aSeed * 0.8) + aSeed * 22.0) * uDrift;
        if (uSpin > 0.0) {
          float a = uTime * uSpin * (0.4 + aSeed);
          float ca = cos(a), sa = sin(a);
          p.xz = mat2(ca, -sa, sa, ca) * p.xz;
        }
        vAlpha = smoothstep(0.0, 0.12, life) * smoothstep(1.0, 0.72, life);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_PointSize = min(aSize * uPix * (260.0 / max(-mv.z, 1.0)), 26.0 * uPix);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform vec3 uColA, uColB;
      uniform float uFade, uTime;
      varying float vSeed, vMix, vAlpha;
      void main() {
        vec2 d = gl_PointCoord - 0.5;
        float r = length(d);
        ${style === 'petal' ? `
          // petal: a soft lens shape, not a disc
          float shape = smoothstep(0.5, 0.06, length(vec2(d.x * 1.9, d.y)));
        ` : style === 'snow' ? `
          float shape = smoothstep(0.5, 0.18, r);
        ` : `
          float shape = smoothstep(0.5, 0.0, r);
          shape *= shape;
        `}
        float tw = 0.75 + 0.25 * sin(uTime * (3.0 + vSeed * 6.0) + vSeed * 40.0);
        vec3 col = mix(uColA, uColB, vMix);
        gl_FragColor = vec4(col, shape * vAlpha * uFade * tw);
        if (gl_FragColor.a < 0.01) discard;
      }`,
  });
  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  return { points, mat, update: (t) => { uTime.value = t; }, setFade: (f) => { uFade.value = f; } };
}

// ---------------------------------------------------------------------------
//  Cloud vocabulary — the sea of cloud the celestial chapters stand on, and
//  the 筋斗云 somersault cloud that carries Wukong.
// ---------------------------------------------------------------------------
function makeCloudPuff(scale = 1, color = 0xf6f3ec, emissive = 0x2a3050, opacity = 1) {
  const g = new THREE.Group();
  const mat = STD({ color, roughness: 1.0, emissive, emissiveIntensity: 0.35, flatShading: true,
    transparent: opacity < 1, opacity, depthWrite: opacity > 0.85 });
  const n = randi(5, 8);
  for (let i = 0; i < n; i++) {
    const r = rand(0.6, 1.25) * scale;
    const b = new THREE.Mesh(new THREE.SphereGeometry(r, 8, 6), mat);
    b.position.set(rand(-1.5, 1.5) * scale, rand(-0.25, 0.3) * scale, rand(-1.0, 1.0) * scale);
    b.scale.y = rand(0.45, 0.7);
    g.add(b);
  }
  // curled tips — the auspicious-cloud silhouette from painted scrolls
  for (let i = 0; i < 3; i++) {
    const t = new THREE.Mesh(new THREE.TorusGeometry(0.42 * scale, 0.2 * scale, 6, 12), mat);
    t.position.set(rand(-1.7, 1.7) * scale, rand(-0.1, 0.15) * scale, rand(-0.9, 0.9) * scale);
    t.rotation.x = Math.PI / 2;
    t.scale.y = 0.6;
    g.add(t);
  }
  return g;
}

function makeCloudSea(count, radius, y, opts = {}) {
  const group = new THREE.Group();
  const puffs = [];
  const minR = opts.minR || 0;
  for (let i = 0; i < count; i++) {
    const a = rnd() * TAU, r = minR + Math.sqrt(rnd()) * (radius - minR);
    const p = makeCloudPuff(rand(2.2, 5.0) * (opts.scale || 1), opts.color || 0xf1efe8, opts.emissive || 0x36406a, opts.opacity !== undefined ? opts.opacity : 1);
    p.position.set(Math.cos(a) * r, y + rand(-3, 3), Math.sin(a) * r);
    group.add(p);
    puffs.push({ p, spd: rand(0.35, 1.1), phase: rand(0, TAU), baseY: p.position.y });
  }
  return {
    group,
    update: (t) => {
      for (const c of puffs) {
        c.p.position.y = c.baseY + Math.sin(t * 0.35 + c.phase) * 1.1;
        c.p.rotation.y = c.phase + t * 0.02 * c.spd;
      }
    },
  };
}

// ---------------------------------------------------------------------------
//  Light shafts — a soft additive cone. Used for the seal on 五行山 and for
//  the Buddha-light of 灵山.
// ---------------------------------------------------------------------------
function makeGodRays(radius, height, color, opacity = 0.22, blades = 9) {
  const group = new THREE.Group();
  const uTime = { value: 0 };
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
    uniforms: { uColor: { value: new THREE.Color(color) }, uOpacity: { value: opacity }, uTime },
    vertexShader: `
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform vec3 uColor; uniform float uOpacity, uTime;
      varying vec2 vUv;
      void main() {
        float v = smoothstep(0.0, 0.45, vUv.y) * smoothstep(1.0, 0.35, vUv.y);
        float h = smoothstep(0.0, 0.5, vUv.x) * smoothstep(1.0, 0.5, vUv.x);
        float flick = 0.82 + 0.18 * sin(uTime * 1.6 + vUv.x * 8.0);
        gl_FragColor = vec4(uColor, v * h * uOpacity * flick);
      }`,
  });
  for (let i = 0; i < blades; i++) {
    const a = (i / blades) * Math.PI;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(radius * 2, height), mat);
    m.rotation.y = a;
    m.renderOrder = 8;
    group.add(m);
  }
  return { group, mat, update: (t) => { uTime.value = t; } };
}

// Expanding halo rings — the visual grammar for "something divine just happened".
function makeHalo(color, count = 4, maxR = 14, opacity = 0.5) {
  const group = new THREE.Group();
  const rings = [];
  for (let i = 0; i < count; i++) {
    const mat = new THREE.MeshBasicMaterial({
      color, transparent: true, opacity, side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending, depthWrite: false,
    });
    const m = new THREE.Mesh(new THREE.RingGeometry(0.9, 1.0, 48), mat);
    m.rotation.x = -Math.PI / 2;
    m.renderOrder = 9;
    group.add(m);
    rings.push({ m, mat, off: i / count });
  }
  return {
    group,
    update: (t, speed = 0.35, gain = 1) => {
      for (const r of rings) {
        const k = (t * speed + r.off) % 1;
        const s = 0.4 + k * maxR;
        r.m.scale.setScalar(s);
        r.mat.opacity = opacity * (1 - k) * gain;
      }
    },
  };
}

// ---------------------------------------------------------------------------
//  Architecture — the temple/palace vocabulary. Everything gold-and-cinnabar
//  in chapters 2 and 5 is assembled from these three functions.
// ---------------------------------------------------------------------------

// A hip roof with upturned eaves, built as stacked tile courses whose overhang
// curves upward toward the corners. Cheap, and reads unmistakably as Chinese.
function makeRoof(w, d, h, opts = {}) {
  const g = new THREE.Group();
  const courses = opts.courses || 9;
  const tileMat = STD({ color: opts.color || C.imperialY, roughness: 0.55, metalness: 0.28 });
  const trimMat = STD({ color: opts.trim || C.cinnabar, roughness: 0.7 });
  for (let i = 0; i < courses; i++) {
    const t = i / (courses - 1);
    // the profile: shrinks toward the ridge, and the lowest courses flare out
    const flare = Math.pow(1 - t, 2.6) * 0.16;
    const cw = w * (1 - t * 0.82) + w * flare;
    const cd = d * (1 - t * 0.82) + d * flare;
    const y = h * (t * t * 0.55 + t * 0.45);
    const course = shadowed(new THREE.Mesh(new THREE.BoxGeometry(cw, h / courses * 1.35, cd), tileMat));
    course.position.y = y;
    g.add(course);
  }
  // ridge beam
  const ridge = shadowed(new THREE.Mesh(new THREE.BoxGeometry(w * 0.24, h * 0.11, d * 0.24), trimMat));
  ridge.position.y = h * 1.02;
  g.add(ridge);
  // four upturned corner horns
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const horn = new THREE.Mesh(
      new THREE.TorusGeometry(w * 0.075, w * 0.016, 5, 10, Math.PI * 0.55),
      trimMat);
    horn.position.set(sx * w * 0.55, h * 0.10, sz * d * 0.55);
    horn.rotation.set(0, Math.atan2(sx, sz), Math.PI * 0.5 - 0.5);
    g.add(horn);
    const tip = new THREE.Mesh(new THREE.ConeGeometry(w * 0.022, w * 0.10, 5), trimMat);
    tip.position.set(sx * w * 0.60, h * 0.20, sz * d * 0.60);
    tip.rotation.set(sz * 0.5, 0, -sx * 0.5);
    g.add(tip);
  }
  return g;
}

// A colonnade hall: platform, red pillars, roof. opts.tiers stacks roofs.
function makeHall(w, d, opts = {}) {
  const g = new THREE.Group();
  const pillarH = opts.pillarH || 7;
  const plat = shadowed(new THREE.Mesh(
    new THREE.BoxGeometry(w * 1.22, 1.4, d * 1.22),
    STD({ color: opts.platform || 0xd8d2c2, roughness: 0.9 })));

}

// A flight of stone steps, used at 南天门 and up 灵山.
function makeStairs(steps, width, rise, run, color = 0xcfc8b6) {
  const g = new THREE.Group();
  const mat = STD({ color, roughness: 0.95 });
  for (let i = 0; i < steps; i++) {
    const s = shadowed(new THREE.Mesh(new THREE.BoxGeometry(width, rise, run * (steps - i) + run), mat));
    s.position.set(0, rise * (i + 0.5), -(run * (steps - i) + run) / 2 + run * 0.5);
    g.add(s);
  }
  // balustrades
  for (const sx of [-1, 1]) {
    for (let i = 0; i < steps; i += 2) {
      const post = shadowed(new THREE.Mesh(new THREE.BoxGeometry(width * 0.05, rise * 2.2, width * 0.05),
        STD({ color: 0xe6e0d0, roughness: 0.9 })));
      post.position.set(sx * width * 0.47, rise * (i + 1.6), -run * i);
      g.add(post);
    }
  }
  g.userData.topY = rise * steps;
  g.userData.depth = run * steps;
  return g;
}

// A hanging banner: cloth panel plus a pole. Colour bands stand in for text.
function makeBanner(w, h, color, accent = C.gold) {
  const g = new THREE.Group();
  const cloth = shadowed(new THREE.Mesh(new THREE.PlaneGeometry(w, h, 1, 6),
    STD({ color, roughness: 0.9, side: THREE.DoubleSide })));
  cloth.position.y = -h / 2;
  g.add(cloth);
  for (let i = 0; i < 3; i++) {
    const band = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.5, h * 0.06),
      STD({ color: accent, side: THREE.DoubleSide, roughness: 0.6, metalness: 0.4 }));
    band.position.set(0, -h * (0.22 + i * 0.24), 0.02);
    g.add(band);
  }
  const rod = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(w * 0.03, w * 0.03, w * 1.15, 6),
    STD({ color: C.darkGold, metalness: 0.7, roughness: 0.35 })));
  rod.rotation.z = Math.PI / 2;
  g.add(rod);
  g.userData.cloth = cloth;
  return g;
}

// ---------------------------------------------------------------------------
//  A burst of sparks for impacts — pre-allocated, replayed by resetting t0.
// ---------------------------------------------------------------------------
function makeBurst(count, color, spread = 6, life = 1.2) {
  const pos = new Float32Array(count * 3);
  const vel = new Float32Array(count * 3);
  const seed = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const dir = new THREE.Vector3(rand(-1, 1), rand(-0.2, 1), rand(-1, 1)).normalize().multiplyScalar(rand(0.35, 1) * spread);
    vel[i * 3] = dir.x; vel[i * 3 + 1] = dir.y; vel[i * 3 + 2] = dir.z;
    seed[i] = rnd();
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aVel', new THREE.BufferAttribute(vel, 3));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), spread * 3);
  const uAge = { value: 99 };
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: {
      uAge, uLife: { value: life }, uColor: { value: new THREE.Color(color) },
      uPix: { value: Math.min(window.devicePixelRatio, 2) },
    },
    vertexShader: `
      attribute vec3 aVel; attribute float aSeed;
      uniform float uAge, uLife, uPix;
      varying float vA;
      void main() {
        float k = clamp(uAge / uLife, 0.0, 1.0);
        vec3 p = aVel * (k * (2.0 - k)) * 3.0;
        p.y -= 4.0 * k * k;
        vA = (1.0 - k) * step(uAge, uLife);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_PointSize = min((2.0 + aSeed * 4.0) * uPix * (240.0 / max(-mv.z, 1.0)), 30.0 * uPix);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform vec3 uColor; varying float vA;
      void main() {
        float r = length(gl_PointCoord - 0.5);
        float s = smoothstep(0.5, 0.0, r);
        gl_FragColor = vec4(uColor, s * s * vA);
        if (gl_FragColor.a < 0.01) discard;
      }`,
  });
  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  return {
    points,
    // age is driven directly by the chapter clock so screenshots stay
    // deterministic — no fire-and-forget timers anywhere in this file.
    setAge: (a) => { uAge.value = a; },
  };
}


// ============================================================================
//  第一回 · 石猴出世 —— 花果山 · 水帘洞
//  Birth of the Stone Monkey, on the Mountain of Flowers and Fruit.
//
//  The island is built as concentric terraces rather than a noise heightfield,
//  because then the ground height is something I can state exactly:
//  islandY() below is the single source of truth, and every tree, monkey and
//  camera target is placed through it. Nothing on this island floats.
// ============================================================================
(function () {

const TERRACES = [
  { r: 96, y: 3.0 },
  { r: 63, y: 15.0 },
  { r: 41, y: 29.0 },
  { r: 25, y: 43.0 },
  { r: 12.5, y: 55.0 },
];
const SEA_Y = 0;

function islandY(x, z) {
  const d = Math.hypot(x, z);
  for (let i = TERRACES.length - 1; i >= 0; i--) {
    if (d <= TERRACES[i].r - 2.0) return TERRACES[i].y;
  }
  return -6;
}

// A terrace: flat top plus a rough rocky rim, so the silhouette is craggy but
// the walkable surface is exactly TERRACES[i].y.
function makeTerrace(r, top, height, seedOff) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(r, r * 1.12, height, 30, 1),
    STD({ color: 0x6a6357, roughness: 1.0, flatShading: true }));
  const pos = body.geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    if (Math.abs(y - height / 2) < 0.01) continue;         // keep the top flat
    const a = Math.atan2(z, x);
    const n = 1 + Math.sin(a * 6 + seedOff) * 0.045 + Math.sin(a * 13 + y * 0.2 + seedOff) * 0.028;
    pos.setXYZ(i, x * n, y, z * n);
  }
  body.geometry.computeVertexNormals();
  shadowed(body);
  body.position.y = top - height / 2;
  g.add(body);

  // grass cap
  const cap = new THREE.Mesh(
    new THREE.CylinderGeometry(r, r, 0.55, 30, 1),
    STD({ color: 0x4e7d3c, roughness: 1.0, flatShading: true }));
  cap.position.y = top - 0.1;
  shadowed(cap);
  g.add(cap);

  // boulders around the rim
  for (let i = 0; i < 16; i++) {
    const a = rand(0, TAU);
    const rr = r * rand(0.86, 1.0);
    const b = shadowed(new THREE.Mesh(
      new THREE.DodecahedronGeometry(rand(1.2, 3.2), 0),
      STD({ color: 0x6f6659, roughness: 1.0, flatShading: true })));
    b.position.set(Math.cos(a) * rr, top - rand(0.2, 1.2), Math.sin(a) * rr);
    b.rotation.set(rand(0, 3), rand(0, 3), rand(0, 3));
    g.add(b);
  }
  return g;
}

    S.eggLight.intensity = charge * 22;
    S.caveGlow.intensity = 4 + Math.sin(t * 1.7) * 1.2;

    const crack = pulse(t, 25.5, 28.5);
    if (crack > 0) {

      S.eggBot.position.x = -k * 2.6;

      S.eggG.visible = crack < 0.985;
      S.eggLight.intensity = 22 + 120 * Math.exp(-Math.pow((t - 26.0) * 1.6, 2));
      S.halo.group.visible = true;
      S.halo.update(t - 25.5, 0.55, 1 - crack * 0.35);
      S.burst.setAge(t - 25.6);
      S.rays.mat.uniforms.uOpacity.value = 0.30 * Math.exp(-Math.pow((t - 27.0) * 0.34, 2));
    } else {
      S.eggG.visible = true;
      S.rays.mat.uniforms.uOpacity.value = 0.05 * charge;
      S.burst.setAge(99);
    }
    S.rays.update(t);
    S.rays.group.rotation.y = t * 0.06;

    // the monkey rises out of the broken stone
    const born = pulse(t, 26.6, 30.0);
    if (born > 0) {
      S.wukong.visible = true;
      const k = easeOut(born);
      S.wukong.position.y = S.summitY + 2.4 + (1 - k) * -3.0;
      S.wukong.scale.setScalar(0.55 + 0.45 * k);

      S.wukong.traverse((o) => {
        if (o.isMesh && o.userData.warmColor) {
          o.material.color.copy(new THREE.Color(0xa9a396)).lerp(o.userData.warmColor, k);
        }
      });

        S.wukong.userData.rig.staff.rotation.z = Math.PI / 2 + Math.sin(t * 1.2) * 0.25;
      }

    } else {
      S.wukong.visible = false;
    }

    const beam = Math.exp(-Math.pow((t - 32.0) * 0.55, 2));
    S.eyeBeamMat.opacity = beam * 0.6;
    for (const b of S.beams) b.visible = beam > 0.02 && S.wukong.visible;

    const joy = pulse(t, 30, 34);
    for (let i = 0; i < S.monkeys.length; i++) {
      const m = S.monkeys[i];
      monkeyIdle(m, t);
      if (joy > 0) {
        const hop = Math.abs(Math.sin(t * 4.2 + i * 0.7));
        m.position.y = m.userData.hopBase + hop * 1.5 * joy;
        m.rotation.y = m.userData.baseRotY + Math.sin(t * 3 + i) * 0.4 * joy;
      }
    }
  },
});

})();
